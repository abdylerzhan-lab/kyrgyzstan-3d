<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кыргызстан 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=PT+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Тёплый шёлк: песок и терракота поверх спутниковой карты с рельефом. Карта на весь экран, карточка места снизу. */
:root{
  --sand:#f8f3ea; --paper:#fffdf8; --ink:#2b2118; --muted:#86715d; --line:#e8dccb;
  --clay:#b5532c; --clay-ink:#fff;
  --display:"Rubik","Segoe UI",Arial,sans-serif; --body:"PT Sans","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sand);color:var(--ink);font:16px/1.45 var(--body);overflow:hidden}
#map{position:fixed;inset:0}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(248,243,234,.96),rgba(248,243,234,.82));border-bottom:1px solid var(--line)}
.brand{font:800 17px/1 var(--display);letter-spacing:.06em;color:var(--clay);background:none;border:0;padding:0;cursor:pointer}
.langs{display:flex;gap:4px}
.langs button{font:700 12px var(--body);padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:#fff}
.chips{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;gap:8px;overflow-x:auto;
  padding:12px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.chips button{flex:none;font:700 14px var(--body);padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:rgba(255,253,248,.96);color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(43,33,24,.18)}
.chips button span{color:var(--muted);font-weight:400;margin-left:5px}
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin b{font:700 13px var(--body);background:var(--paper);color:var(--ink);padding:4px 9px;border-radius:12px;border:1px solid var(--line);white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin i{width:16px;height:16px;border-radius:50%;background:var(--clay);border:3px solid #fff;margin-top:4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:50vh;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 30px rgba(43,33,24,.25);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .35s ease}
.sheet.open{transform:none}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font:800 26px/1.08 var(--display);margin:0;text-wrap:balance}
.region{color:var(--muted);font-size:14px;margin-top:3px}
.close{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sand);font-size:18px;cursor:pointer;color:var(--ink)}
.tabs{display:flex;gap:6px;margin:12px 0 10px}
.tabs button{font:700 14px var(--body);padding:8px 14px;border-radius:20px;border:1px solid var(--clay);background:var(--paper);color:var(--clay);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--clay);color:#fff}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.facts li{background:var(--sand);border-radius:12px;padding:9px 12px;font-size:15px}
.facts small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.gal{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.gal figure{flex:none;width:min(78vw,340px);margin:0}
.gal img,.gal video{width:100%;height:210px;object-fit:cover;border-radius:14px;background:var(--line);display:block}
.gal figcaption{font-size:11.5px;color:var(--muted);margin-top:4px}
.gal figcaption a{color:inherit}
model-viewer{width:100%;height:300px;border-radius:16px;background:linear-gradient(#d7e7f1 0%,#eef4f6 60%,#e6d4b3 60%,#dcc7a3 100%)}
.more{display:inline-block;margin-top:10px;font-weight:700;color:var(--clay)}
.empty{color:var(--muted);font-size:14px;background:var(--sand);border-radius:12px;padding:12px}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-top-right{top:calc(56px + env(safe-area-inset-top,0px))}
button:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="Карта Кыргызстана с рельефом"></div>

<div class="top">
  <button class="brand" id="home" type="button">КЫРГЫЗСТАН 3D</button>
  <div class="langs" role="group" aria-label="Язык">
    <button id="lang-kg" type="button" aria-pressed="false">KG</button>
    <button type="button" aria-pressed="true">RU</button>
    <button id="lang-en" type="button" aria-pressed="false">EN</button>
  </div>
</div>

<div class="chips" id="chips"></div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grip"></div>
  <div class="head">
    <div><h1 id="s-name"></h1><div class="region" id="s-region"></div></div>
    <button class="close" id="s-close" type="button" aria-label="Закрыть">✕</button>
  </div>
  <div class="tabs" role="group" aria-label="Разделы">
    <button type="button" data-tab="about" aria-pressed="true">О месте</button>
    <button type="button" data-tab="media" aria-pressed="false">Фото и видео</button>
    <button type="button" data-tab="model" aria-pressed="false" id="tab-model">3D</button>
  </div>
  <div id="s-body"></div>
</section>

<script>
// камера для каждого места: насколько близко подлететь и под каким углом
const VIEW = {
  "burana":       {zoom: 15.6, pitch: 62, bearing: 30},
  "kel-suu":      {zoom: 12.9, pitch: 55, bearing: 160},
  "tash-rabat":   {zoom: 14.6, pitch: 64, bearing: 120},
  "karakol":      {zoom: 15.8, pitch: 58, bearing: -20},
  "sulaiman-too": {zoom: 14.8, pitch: 62, bearing: 60}
};
const KG = [[69.2, 39.15], [80.3, 43.3]];
let PLACES = [], current = null;

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      sat: {type: "raster", tileSize: 256, maxzoom: 15,
        tiles: ["https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"],
        attribution: '<a href="https://s2maps.eu" target="_blank" rel="noopener">Sentinel-2 cloudless — s2maps.eu</a> by EOX (Copernicus Sentinel data 2020)'},
      dem: {type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
        attribution: 'Рельеф: <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener">AWS Terrain Tiles</a>'},
      // отдельный источник для теней рельефа — так MapLibre рисует чище
      dem2: {type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"]}
    },
    layers: [
      {id: "bg", type: "background", paint: {"background-color": "#e9dcc6"}},
      {id: "sat", type: "raster", source: "sat"},
      {id: "shade", type: "hillshade", source: "dem2", paint: {"hillshade-exaggeration": 0.35, "hillshade-shadow-color": "#3b2a1c"}}
    ],
    terrain: {source: "dem", exaggeration: 1.3}
  },
  bounds: KG, fitBoundsOptions: {padding: 20},
  pitch: 40, maxPitch: 80, attributionControl: {compact: true}
});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), "top-right");
map.on("load", async () => {
  try { map.setSky({"sky-color": "#a9c9e6", "horizon-color": "#f3e7d3", "fog-color": "#f3e7d3", "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.6, "fog-ground-blend": 0.3}); } catch (e) {}
  // граница страны и затемнение всего, что за ней
  try {
    const kg = await (await fetch("kg-border.json")).json();
    const outer = kg.features[0].geometry.coordinates.map(p => p[0]);
    map.addSource("kg", {type: "geojson", data: kg});
    map.addSource("mask", {type: "geojson", data: {type: "Feature", geometry: {type: "Polygon",
      coordinates: [[[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]], ...outer]}}});
    map.addLayer({id: "mask", type: "fill", source: "mask", paint: {"fill-color": "#f8f3ea", "fill-opacity": 0.55}});
    map.addLayer({id: "kg-line", type: "line", source: "kg", paint: {"line-color": "#b5532c", "line-width": 2.2, "line-opacity": 0.9}});
  } catch (e) { console.warn("граница не загрузилась", e); }
});

function pin(p) {
  const el = document.createElement("div");
  el.className = "pin"; el.innerHTML = "<b>" + p.short + "</b><i></i>";
  el.addEventListener("click", ev => { ev.stopPropagation(); open(p.id); });
  new maplibregl.Marker({element: el, anchor: "bottom"}).setLngLat([p.lon, p.lat]).addTo(map);
}

const sheet = document.getElementById("sheet"), body = document.getElementById("s-body");
function open(id) {
  const p = PLACES.find(x => x.id === id); if (!p) return;
  current = p;
  const v = VIEW[id] || {zoom: 14, pitch: 60, bearing: 0};
  map.flyTo({center: [p.lon, p.lat], zoom: v.zoom, pitch: v.pitch, bearing: v.bearing, duration: 4200, essential: true,
    padding: {bottom: Math.round(window.innerHeight * 0.5), top: 40, left: 0, right: 0}});
  document.getElementById("s-name").textContent = p.name_ru;
  document.getElementById("s-region").textContent = p.region_ru || "";
  document.getElementById("tab-model").hidden = !p.model;
  tab("about");
  sheet.classList.add("open");
  document.getElementById("chips").hidden = true;
}
function closeSheet() {
  sheet.classList.remove("open"); document.getElementById("chips").hidden = false; current = null;
  map.flyTo({center: [74.8, 41.3], zoom: map.getZoom() > 8 ? 6.3 : map.getZoom(), pitch: 40, bearing: 0, duration: 3000, padding: {bottom: 0, top: 0, left: 0, right: 0}});
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function tab(name) {
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-pressed", b.dataset.tab === name);
  const p = current;
  if (name === "about") {
    body.innerHTML = (p.facts_ru && p.facts_ru.length)
      ? '<ul class="facts">' + p.facts_ru.map(f => "<li>" + esc(f.text) + (f.src ? "<small>Источник: " + esc(f.src) + "</small>" : "") + "</li>").join("") + "</ul>"
      : '<div class="empty">Описание готовится.</div>';
  } else if (name === "media") {
    const m = p.media || [];
    body.innerHTML = m.length ? '<div class="gal">' + m.map(x =>
      "<figure>" + (x.type === "video"
        ? '<video src="' + esc(x.file) + '" controls playsinline muted preload="metadata"></video>'
        : '<img src="' + esc(x.file) + '" alt="' + esc(p.name_ru) + '" loading="lazy">') +
      '<figcaption>' + esc(x.author || "") + (x.license ? ", " + esc(x.license) : "") +
      (x.page ? ' · <a href="' + esc(x.page) + '" target="_blank" rel="noopener">Wikimedia Commons</a>' : "") + "</figcaption></figure>").join("") + "</div>"
      : '<div class="empty">Фото и видео скоро появятся.</div>';
  } else {
    body.innerHTML = '<model-viewer src="' + esc(p.model) + '" camera-controls auto-rotate touch-action="pan-y" camera-orbit="' + esc(p.orbit) + '" field-of-view="30deg" shadow-intensity="1" interaction-prompt="none" alt="3D-модель"></model-viewer>' +
      (p.note3d ? '<div class="region">' + esc(p.note3d) + '</div>' : '') +
      (p.page ? '<a class="more" href="' + esc(p.page) + '">' + (p.id === 'burana' ? 'Открыть 3D на весь экран: «сейчас» и «каким был» →' : 'Открыть 3D на весь экран →') + '</a>' : '');
  }
}
for (const b of document.querySelectorAll(".tabs button")) b.onclick = () => tab(b.dataset.tab);
document.getElementById("s-close").onclick = closeSheet;
document.getElementById("home").onclick = () => { if (current) closeSheet(); map.fitBounds(KG, {padding: 20, pitch: 40, bearing: 0, duration: 2500}); };
for (const id of ["lang-kg", "lang-en"]) document.getElementById(id).onclick = () => alert("Кыргызча жана English — в рабочей версии.");

(async () => {
  const d = await (await fetch("media/places.json")).json();
  const SHORT = {"burana": "Бурана", "kel-suu": "Кель-Суу", "tash-rabat": "Таш-Рабат", "karakol": "Храм Троицы", "sulaiman-too": "Сулайман-Тоо"};
  PLACES = d.places.map(p => Object.assign({short: SHORT[p.id] || p.name_ru}, p,
    p.id === "burana" ? {model: "burana-now.glb", page: "burana.html", orbit: "35deg 78deg 62m"} :
    p.id === "kel-suu" ? {model: "kel-suu.glb", orbit: "15deg 52deg 19000m", page: "kel-suu.html",
      note3d: "Макет 14 × 14 км по спутниковым высотам и снимку Sentinel-2. Горы по высоте усилены в 1,3 раза, чтобы лучше читались."} : {}));
  const chips = document.getElementById("chips");
  for (const p of PLACES) {
    pin(p);
    const b = document.createElement("button"); b.type = "button";
    b.innerHTML = esc(p.short) + "<span>" + esc((p.region_ru || "").split(",")[0].replace(" область", " обл.")) + "</span>";
    b.onclick = () => open(p.id); chips.appendChild(b);
  }
})();
</script>
</body>
</html>
